server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Lightweight health endpoint for CapRover / Swarm healthchecks.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Gzip static assets (the classified CSV can be large).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/csv;
    gzip_min_length 1024;

    # SPA fallback: unknown routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built assets aggressively (hashed filenames); never cache the data.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(csv|json)$ {
        add_header Cache-Control "no-cache";
    }
}
